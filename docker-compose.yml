services:
  convert-a-tron:
    build: .
    image: ghcr.io/endless1233214/convert-a-tron:latest
    container_name: convert-a-tron
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MAX_UPLOAD_MB: "500"
      JOB_TTL_MINUTES: "60"
      DATA_DIR: /data
    volumes:
      - convert-a-tron-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1G,mode=1777
    deploy:
      resources:
        limits:
          memory: 4G
volumes:
  convert-a-tron-data:
