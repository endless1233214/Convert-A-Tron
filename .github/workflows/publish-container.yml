name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/convert-a-tron

jobs:
  security:
    name: Test and scan release image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository (read-only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install and audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off

      - name: Run application tests
        run: python -m pytest -q

      - name: Build local release candidate
        run: docker build --pull --tag convert-a-tron:security-test .

      - name: Verify hardened container runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' convert-a-tron:security-test)" = '568:568'
          docker volume create convert-a-tron-ci-data >/dev/null
          docker run --detach --name convert-a-tron-ci \
            --publish 127.0.0.1:8080:8080 \
            --read-only \
            --cap-drop ALL \
            --tmpfs /tmp \
            --mount type=volume,src=convert-a-tron-ci-data,dst=/data \
            convert-a-tron:security-test
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              docker logs convert-a-tron-ci
              exit 1
            fi
            sleep 1
          done
          test "$(docker exec convert-a-tron-ci id -u)" = '568'

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: convert-a-tron:security-test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'

      - name: Remove test container and volume
        if: ${{ always() }}
        run: |
          docker rm --force convert-a-tron-ci >/dev/null 2>&1 || true
          docker volume rm convert-a-tron-ci-data >/dev/null 2>&1 || true

  publish:
    needs: security
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
